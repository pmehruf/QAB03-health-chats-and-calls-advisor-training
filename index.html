<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QAB03 · Health Chats &amp; Calls — Advisor Training</title>
<style>
:root{
  --bg:#EEF1F0;
  --surface:#FFFFFF;
  --surface-2:#F5F7F6;
  --ink:#16212B;
  --ink-soft:#4A5A68;
  --ink-faint:#8494A0;
  --line:#DCE3E1;
  --line-strong:#C3CDCA;
  --r1:#B3261E;
  --r1-bg:#FBEAE9;
  --r2:#D6493C;
  --r2-bg:#FCEEEC;
  --r3:#C7861A;
  --r3-bg:#FBF1DE;
  --r4:#5C8F4A;
  --r4-bg:#EBF3E7;
  --r5:#1E7A4C;
  --r5-bg:#E4F3EB;
  --sugg:#5B5FBF;
  --sugg-bg:#ECEDF9;
  --persona:#7A4FB0;
  --persona-bg:#F2E9FA;
  --shadow: 0 1px 2px rgba(22,33,43,.06), 0 4px 16px rgba(22,33,43,.06);
  --radius: 10px;
  --sidebar-w: 250px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  background:var(--bg);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  line-height:1.5;
}
::selection{background:#CFE0DC;}
a{color:inherit;}

/* ---------- Severity rail (signature element) ---------- */
.rail{
  display:flex; height:6px; width:100%; border-radius:4px; overflow:hidden;
}
.rail span{flex:1;}
.rail .s1{background:var(--r1);} .rail .s2{background:var(--r2);}
.rail .s3{background:var(--r3);} .rail .s4{background:var(--r4);}
.rail .s5{background:var(--r5);}

/* ---------- Layout ---------- */
.app{display:flex; min-height:100vh;}
.sidebar{
  width:var(--sidebar-w); flex-shrink:0; background:var(--ink); color:#E7ECEF;
  position:fixed; top:0; left:0; bottom:0; overflow-y:auto; z-index:40;
  display:flex; flex-direction:column;
  transition:transform .25s ease;
}
.sidebar-head{padding:22px 20px 14px; border-bottom:1px solid rgba(255,255,255,.08);}
.sidebar-head .tag{
  font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:#9FB3C8; font-weight:600;
}
.sidebar-head h1{font-size:16px; margin:6px 0 2px; font-weight:700; letter-spacing:-.01em;}
.sidebar-head .sub{font-size:12px; color:#8FA0AE;}
.sidebar nav{padding:10px 10px 6px; flex:1;}
.navlink{
  display:flex; align-items:center; gap:10px; width:100%; text-align:left;
  padding:10px 12px; border-radius:8px; background:none; border:none; color:#C9D3D9;
  font-size:13.5px; font-weight:500; cursor:pointer; margin-bottom:2px;
  font-family:inherit;
}
.navlink .num{
  font-size:10.5px; width:18px; height:18px; border-radius:5px; background:rgba(255,255,255,.08);
  display:flex; align-items:center; justify-content:center; flex-shrink:0; font-weight:700;
}
.navlink:hover{background:rgba(255,255,255,.06); color:#fff;}
.navlink.active{background:#28394A; color:#fff;}
.navlink.active .num{background:#4C7CE0;}
.sidebar-foot{padding:14px 20px 20px; border-top:1px solid rgba(255,255,255,.08);}
.progress-label{font-size:11px; color:#8FA0AE; margin-bottom:6px; display:flex; justify-content:space-between;}
.progress-track{height:5px; background:rgba(255,255,255,.1); border-radius:4px; overflow:hidden;}
.progress-fill{height:100%; background:linear-gradient(90deg,var(--r3),var(--r5)); width:0%; transition:width .4s ease;}

.menu-toggle{
  display:none; position:fixed; top:14px; left:14px; z-index:60; background:var(--ink); color:#fff;
  border:none; border-radius:8px; width:38px; height:38px; align-items:center; justify-content:center;
  box-shadow:var(--shadow); cursor:pointer;
}

.main{margin-left:var(--sidebar-w); flex:1; min-width:0; padding:34px 40px 80px; max-width:1180px;}
.view{display:none;}
.view.active{display:block; animation:fadein .35s ease;}
@keyframes fadein{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}

.eyebrow{font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-faint); font-weight:700; margin-bottom:8px;}
.view h2{font-size:26px; margin:0 0 6px; letter-spacing:-.015em;}
.view > .intro{color:var(--ink-soft); font-size:14.5px; max-width:760px; margin-bottom:26px;}

.callout{
  background:var(--surface-2); border:1px solid var(--line); border-left:4px solid #4C7CE0;
  border-radius:8px; padding:14px 16px; font-size:13.5px; color:var(--ink-soft); margin:0 0 24px;
}
.callout b{color:var(--ink);}
.callout ul{margin:6px 0 0; padding-left:18px;}

/* ---------- Cards ---------- */
.card{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  box-shadow:var(--shadow);
}
.grid{display:grid; gap:14px;}
.grid-5{grid-template-columns:repeat(5,1fr);}
.grid-2{grid-template-columns:repeat(2,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
@media(max-width:980px){.grid-5{grid-template-columns:repeat(2,1fr);} .grid-3{grid-template-columns:repeat(2,1fr);}}
@media(max-width:640px){.grid-5,.grid-3,.grid-2{grid-template-columns:1fr;}}

.rating-card{padding:16px; cursor:pointer; border-top:4px solid var(--c);}
.rating-card .num{font-size:28px; font-weight:800; color:var(--c);}
.rating-card .lbl{font-size:12.5px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--ink);}
.rating-card .desc{font-size:12.5px; color:var(--ink-soft); margin-top:6px;}
.rating-card .count{font-size:11px; color:var(--ink-faint); margin-top:10px;}

/* badges */
.badge{
  display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:700;
  padding:3px 9px; border-radius:20px; white-space:nowrap; letter-spacing:.02em;
}
.badge-1{background:var(--r1-bg); color:var(--r1);}
.badge-2{background:var(--r2-bg); color:var(--r2);}
.badge-3{background:var(--r3-bg); color:var(--r3);}
.badge-4{background:var(--r4-bg); color:var(--r4);}
.badge-5{background:var(--r5-bg); color:var(--r5);}
.badge-sugg{background:var(--sugg-bg); color:var(--sugg);}
.badge-persona{background:var(--persona-bg); color:var(--persona);}
.badge-outline{background:none; border:1px solid var(--line-strong); color:var(--ink-soft); font-weight:600;}

/* explorer */
.toolbar{display:flex; flex-wrap:wrap; gap:10px; margin-bottom:18px; align-items:center;}
.search-box{
  flex:1; min-width:220px; display:flex; align-items:center; gap:8px; background:var(--surface);
  border:1px solid var(--line-strong); border-radius:9px; padding:9px 14px;
}
.search-box input{border:none; outline:none; font-size:14px; width:100%; font-family:inherit; background:none; color:var(--ink);}
.chip-row{display:flex; flex-wrap:wrap; gap:6px;}
.chip{
  padding:6px 12px; border-radius:20px; border:1px solid var(--line-strong); background:var(--surface);
  font-size:12px; font-weight:600; cursor:pointer; color:var(--ink-soft);
}
.chip.active{background:var(--ink); color:#fff; border-color:var(--ink);}
.result-count{font-size:12px; color:var(--ink-faint); margin:2px 0 14px;}

.rule-card{padding:16px 18px; margin-bottom:12px; position:relative; overflow:hidden;}
.rule-card::before{content:""; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--c);}
.rule-head{display:flex; justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap;}
.rule-code{font-size:11.5px; font-weight:800; color:var(--ink-faint); letter-spacing:.03em;}
.rule-title{font-size:15px; font-weight:700; margin:2px 0 6px;}
.rule-rule{font-size:13.5px; color:var(--ink-soft); line-height:1.55;}
.rule-tags{display:flex; gap:6px; flex-wrap:wrap; margin-top:8px;}
.rule-more{margin-top:10px; padding-top:10px; border-top:1px dashed var(--line);}
.rule-more.hidden{display:none;}
.note-item{font-size:12.5px; color:var(--ink-soft); background:var(--surface-2); border-radius:6px; padding:8px 10px; margin-bottom:6px;}
.note-item b{color:var(--ink);}
.annex-item{font-size:13px; margin-bottom:8px; padding-left:20px; position:relative;}
.annex-item .letter{position:absolute; left:0; top:0; font-weight:800; color:var(--ink-faint); font-size:12px;}
.expand-btn{
  background:none; border:1px solid var(--line-strong); border-radius:7px; padding:6px 12px; font-size:12px;
  font-weight:700; color:var(--ink-soft); cursor:pointer; margin-top:10px; font-family:inherit;
}
.expand-btn:hover{background:var(--surface-2);}

/* modules */
.module-card{margin-bottom:14px; overflow:hidden;}
.module-header{
  padding:16px 20px; display:flex; justify-content:space-between; align-items:center; cursor:pointer; gap:12px;
}
.module-header h3{margin:0; font-size:15.5px;}
.module-header .m-sub{font-size:12px; color:var(--ink-faint); margin-top:3px; font-weight:500;}
.module-header .chev{transition:transform .2s ease; color:var(--ink-faint); flex-shrink:0;}
.module-header.open .chev{transform:rotate(180deg);}
.module-body{max-height:0; overflow:hidden; transition:max-height .4s ease;}
.module-body.open{max-height:4000px;}
.module-body-inner{padding:0 20px 20px; border-top:1px solid var(--line);}
.topic-block{padding:16px 0; border-bottom:1px solid var(--line);}
.topic-block:last-child{border-bottom:none;}
.topic-block h4{margin:0 0 4px; font-size:14px; display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
.topic-block .sop-requires{font-size:13px; color:var(--ink-soft); margin-bottom:8px;}
.topic-block .field-label{font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-faint); font-weight:700; margin:10px 0 4px;}
.example-box{
  background:var(--surface-2); border-radius:8px; padding:10px 12px; font-size:12.5px; color:var(--ink-soft); margin-top:6px;
}

/* boundaries */
.boundary-card{padding:18px 20px; margin-bottom:14px;}
.boundary-title{font-size:14.5px; font-weight:700; margin-bottom:10px;}
.vs-row{display:flex; gap:14px; align-items:stretch; flex-wrap:wrap;}
.vs-col{flex:1; min-width:220px; background:var(--surface-2); border-radius:8px; padding:12px 14px;}
.vs-col .badge{margin-bottom:6px;}
.vs-col p{margin:4px 0 0; font-size:13px; color:var(--ink-soft);}
.vs-mid{display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:800; color:var(--ink-faint); text-transform:uppercase; padding:0 4px;}
.boundary-source{font-size:11.5px; color:var(--ink-faint); margin-top:10px; font-weight:600;}

/* scenarios */
.scenario-card{padding:18px 20px; margin-bottom:16px;}
.scenario-num{font-size:11px; font-weight:800; color:var(--sugg); text-transform:uppercase; letter-spacing:.06em;}
.scenario-text{font-size:14.5px; margin:8px 0 14px; line-height:1.6;}
.scenario-q{font-size:13px; font-weight:700; margin-bottom:6px;}
.scenario-reveal{
  background:var(--surface-2); border-radius:8px; padding:12px 14px; margin-top:8px; font-size:13px; color:var(--ink-soft); display:none;
}
.scenario-reveal.shown{display:block;}
.reveal-btn{
  background:var(--ink); color:#fff; border:none; border-radius:7px; padding:9px 16px; font-size:12.5px;
  font-weight:700; cursor:pointer; font-family:inherit;
}
.reveal-btn:hover{opacity:.88;}

/* common mistakes (from feedback log) */
.stat-strip{display:flex; flex-wrap:wrap; gap:12px; margin-bottom:24px;}
.stat-box{flex:1; min-width:130px; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:14px 16px;}
.stat-box .stat-num{font-size:24px; font-weight:800; color:var(--ink);}
.stat-box .stat-lbl{font-size:11.5px; color:var(--ink-faint); font-weight:600; margin-top:2px;}
.mistake-card{padding:18px 20px; margin-bottom:16px;}
.mistake-head{display:flex; justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap; margin-bottom:4px;}
.mistake-title{font-size:15px; font-weight:700;}
.mistake-count{font-size:11.5px; color:var(--sugg); font-weight:700; background:var(--sugg-bg); padding:3px 10px; border-radius:20px; white-space:nowrap;}
.mistake-codes{display:flex; gap:5px; flex-wrap:wrap; margin:8px 0 14px;}
.code-pill{
  font-size:10.5px; font-weight:800; color:var(--ink-soft); background:var(--surface-2); border:1px solid var(--line);
  padding:2px 8px; border-radius:12px; cursor:pointer; font-family:inherit;
}
.code-pill:hover{background:var(--line);}
.mistake-cols{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
@media(max-width:760px){.mistake-cols{grid-template-columns:1fr;}}
.mistake-col-head{font-size:11px; text-transform:uppercase; letter-spacing:.05em; font-weight:800; margin-bottom:8px; display:flex; align-items:center; gap:6px;}
.mistake-col-head.wrong{color:var(--r1);}
.mistake-col-head.ideal{color:var(--r5);}
.mistake-list{margin:0; padding-left:18px; font-size:13px; color:var(--ink-soft); line-height:1.55;}
.mistake-list li{margin-bottom:8px;}
.source-note{font-size:11.5px; color:var(--ink-faint); margin-top:2px;}

/* quiz */
.quiz-shell{max-width:680px;}
.quiz-progress{display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; font-size:12.5px; color:var(--ink-faint); font-weight:600;}
.quiz-dots{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:16px;}
.quiz-dot{
  width:26px; height:26px; border-radius:7px; border:1.5px solid var(--line-strong); background:var(--surface);
  font-size:10.5px; font-weight:800; color:var(--ink-faint); cursor:pointer; font-family:inherit;
  display:flex; align-items:center; justify-content:center;
}
.quiz-dot.locked{cursor:not-allowed; opacity:.45;}
.quiz-dot.current{border-color:var(--ink); border-width:2px; color:var(--ink);}
.quiz-dot.correct{background:var(--r5-bg); border-color:var(--r5); color:var(--r5);}
.quiz-dot.incorrect{background:var(--r1-bg); border-color:var(--r1); color:var(--r1);}
.quiz-card{padding:24px 26px;}
.quiz-q{font-size:16px; font-weight:700; margin-bottom:18px; line-height:1.5;}
.quiz-opt{
  display:block; width:100%; text-align:left; padding:12px 14px; border-radius:9px; border:1.5px solid var(--line-strong);
  background:var(--surface); font-size:13.5px; cursor:pointer; margin-bottom:9px; font-family:inherit; color:var(--ink);
  transition:border-color .15s, background .15s;
}
.quiz-opt:hover{border-color:var(--ink-faint);}
.quiz-opt.correct{border-color:var(--r5); background:var(--r5-bg); font-weight:700;}
.quiz-opt.incorrect{border-color:var(--r1); background:var(--r1-bg); font-weight:700;}
.quiz-opt.disabled{cursor:default;}
.quiz-explain{
  margin-top:14px; padding:12px 14px; background:var(--surface-2); border-radius:8px; font-size:13px; color:var(--ink-soft); display:none;
}
.quiz-explain.shown{display:block;}
.quiz-nav{display:flex; justify-content:space-between; gap:10px; margin-top:18px;}
.btn{
  background:var(--ink); color:#fff; border:none; border-radius:8px; padding:10px 18px; font-size:13px;
  font-weight:700; cursor:pointer; font-family:inherit;
}
.btn.secondary{background:none; border:1.5px solid var(--line-strong); color:var(--ink-soft);}
.btn:disabled{opacity:.4; cursor:default;}
.quiz-result{padding:34px 30px; text-align:center;}
.quiz-result .score{font-size:44px; font-weight:800; margin:10px 0;}
.quiz-result .score-lbl{font-size:13px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.06em; font-weight:700;}
.quiz-result .result-actions{display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:6px;}
.review-banner{
  display:flex; justify-content:space-between; align-items:center; background:var(--sugg-bg); color:var(--sugg);
  font-size:12.5px; font-weight:700; padding:9px 14px; border-radius:8px; margin-bottom:14px;
}

/* reference table */
.ref-table{width:100%; border-collapse:collapse; font-size:12.8px;}
.ref-table th{
  text-align:left; padding:9px 12px; background:var(--surface-2); font-size:10.8px; text-transform:uppercase;
  letter-spacing:.05em; color:var(--ink-faint); border-bottom:1px solid var(--line); position:sticky; top:0;
}
.ref-table td{padding:10px 12px; border-bottom:1px solid var(--line); vertical-align:top; color:var(--ink-soft);}
.ref-table tr:hover td{background:var(--surface-2);}
.ref-table .code-cell{font-weight:800; color:var(--ink); white-space:nowrap;}
.ref-scroll{max-height:640px; overflow-y:auto; border:1px solid var(--line); border-radius:var(--radius); background:var(--surface);}

.footer-note{font-size:11.5px; color:var(--ink-faint); margin-top:40px; padding-top:16px; border-top:1px solid var(--line);}

@media(max-width:900px){
  .sidebar{transform:translateX(-100%);}
  .sidebar.open{transform:translateX(0);}
  .main{margin-left:0; padding:70px 18px 60px;}
  .menu-toggle{display:flex;}
  .grid-5{grid-template-columns:repeat(2,1fr);}
}
</style>
</head>

</button>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <div class="tag">Quality Bliss · SOP QAB03</div>
      <h1>Health Chats &amp; Calls</h1>
      <div class="sub">Advisor training resource</div>
    </div>
    <nav id="navList"></nav>
    <div class="sidebar-foot">
      <div class="progress-label"><span>Your progress</span><span id="progressPct">0%</span></div>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    </div>
  </aside>

  <main class="main">
    <div id="viewRoot"></div>
  </main>
</div>

<script>
const RULES = [
{code:"1.1", title:"Policy Recommendation", rating:1, type:"rating", medium:"both", lo:null, module:"profiling",
 rule:"The recommended plan to the customer was incorrect / recommendation was made without understanding the profile completely.",
 notes:[],
 annexure:[
  {letter:"A", text:"Not asking all the mandatory questions to understand the customer's profile — whom, age, past hospitalisations, current and previous medications, and medical diagnoses. This applies even if the customer has disclosed certain conditions prior to medical profiling."},
  {letter:"B", text:"Recommending plans that do not align with our recommendations or the disease-wise tool or as per age condition (like age restriction in OS+ etc).", notes:["Example: if the tool gives an option of one comprehensive plan and one restrictive plan, giving only the comprehensive plan with the rejection disclaimer would be rated 1. Advisors should talk about the restrictive plan or just let the lead know there would be another option with high probability of issuance."]},
  {letter:"C", text:"Not reconfirming whom, age, medical profile, and current address of the proposer when the customer comes back after 90 days from the last day of discussion.", notes:["The advisor who initiated the conversation is responsible for confirming whom, age, medical profile information and can utilise the health questionnaire as needed. However, if the customer fails to disclose certain conditions that were previously mentioned, the advisor should reconfirm those details as well. Additionally, the advisor should verify the current address pincode of the proposer before sharing the premiums.","Ideal procedure would be doing profiling when the lead comes back after 30 days from the last conversation. It would be highlighted if not followed."]},
  {letter:"D", text:"Not asking all the mandatory questions mentioned in the disease-wise tool.", notes:["If a missed mandatory question doesn't affect the recommendation, it won't be marked."]},
  {letter:"E", text:"Not requesting the reports and getting the query answered from the medical queries space using chat ID if the customer is unaware of the type of a particular condition and unable to describe it, and thus the advisor is unsure about the recommendation.", notes:["If a customer provides a report for a condition that can be clearly understood by the advisor, the advisor can decide to proceed with the recommendation for that customer. This should only be done when there is no confusion regarding the medical condition mentioned in the report."]},
  {letter:"F", text:"Not asking for the timeline of surgery when the customer discloses a surgery (needs to be asked even if not specified in the disease-wise tool).", notes:["If a customer mentions something vague like \"some time ago\" or \"a while back,\" the advisor should inquire about an approximate timeline to understand when the surgery occurred."]},
  {letter:"G", text:"Not giving the correct individual/floater combinations (whichever is possible with the insurer).", notes:["Not giving floater combinations when it is possible for the profile would be rated 1.","Not talking about the exit ages when we recommend floater options for the ages 23 and above would be rated 3."]},
  {letter:"H", text:"Not asking for the exact ages of the customers or not verifying the date of birth (DOB) when the customer provides an approximate age or when age is borderline (Ex: 55 in case Energy is the reco, 91 days, etc.).", notes:["The advisor who is doing profiling is responsible for the same."]},
  {letter:"I", text:"Failing to verify with the customer when different ages are provided in various places, such as the questionnaire, chat, or call."},
  {letter:"J", text:"Not confirming the residential status of the insured and the proposer for International customers.", notes:["It is mandatory to check if they are holding an Indian Passport (applicable for all NRI insured members and proposer) before proceeding further. If the customer (proposer/insured) doesn't have an Indian Passport (cases where NRIs gave up Indian Citizenship) or the customer is an OCI holder, then we cannot assist further.","The advisor who does profiling is responsible for giving a disclaimer, asking about the Indian passport, proposer details, pincode of the proposer confirmation, else it would be rated 1.","Not confirming the residential status of the Indian customer before scheduling the payment call would be rated 3."]},
  {letter:"K", text:"If the advisor asks all 5 PED questions in chat/call, these should be asked in a way that the core idea or intent is not changed. Else it will be rated 1.", notes:["The 5 PED profiling questions: (1) Have you ever been admitted to a hospital or had a surgery or stayed for observation, even for one night? (2) Have you been diagnosed by a doctor with any long-term or short-term illness or condition? Examples include thyroid issues, diabetes, or hypertension. (3) Apart from the conditions we've already discussed, are there any other medications going on right now, or anything you've taken regularly in the past? (4) Have you undergone investigative tests such as scans, X-rays, or blood tests that showed any findings — even if the doctor said 'nothing to worry'? (5) Is there anything else about your health — past or present — that an insurer should know? For example, genetic issues, congenital conditions, or birth defects.","Skipping the entire text/word in bold under each question will be rated 4.","Missing a question completely would still be rated 1."]},
  {letter:"L", text:"Not providing recommendations as per playbook when the customer is adamant about maternity after giving the disclaimer would be rated 1. If the customer wants one more option to consider for maternity cover or if the customer wants maternity coverage specifically in HDFC, then we should pitch OS+/OS with Parenthood Add-on.", notes:["If the customer has a requirement of having higher maternity coverage with less waiting period, or if the customer feels Aspire Titanium+ maternity coverage is too low, advisors are expected to pitch the Fast Forward add-on, else it would be rated 1. Giving any wrong information or omission of clauses related to the Fast Forward add-on would also be rated 1."]},
  {letter:"M", text:"If the customer still chooses to opt for the Care Ultimate plan even after giving the narrative/disclaimer, the advisor should proceed with the plan discussion. Not discussing the plan or stating that it is unavailable will be rated 1."}
 ]},

{code:"1.2", title:"Premiums", rating:1, type:"rating", medium:"both", lo:null, module:"premiums",
 rule:"Premiums shared with customers are incorrect.",
 notes:[],
 annexure:[
  {letter:"A", text:"The current address pincode of the proposer needs to be considered for calculating premiums.", notes:["For cases with multiple profiles in one chat / cases where the lead cannot be the proposer for the insured, the advisor needs to check who will be the proposer for each of these profiles and get the pincode accordingly, and not just use one pincode across the profiles without confirmation. Else, it would be rated 1. The advisor who calculates the premiums would be responsible for the same."]},
  {letter:"B", text:"Sharing premiums without including mandatory riders, requested riders, or those riders promised by the advisor."},
  {letter:"C", text:"Sharing wrong premiums as a result of entering the wrong inception date in Care porting plans."},
  {letter:"D", text:"Advisors can use either the OS porting premium tool link or 1up portal link to generate premiums. If the premiums were generated through our Falcon tool — which gives fresh plan premiums considering FCED discount for fresh cases instead of a porting scenario — it would be considered an error.", notes:["The link gives base premiums without any add-ons, so not specifying that these are the approx premiums without add-ons would be rated 4."]}
 ]},

{code:"1.3", title:"Heads-up", rating:1, type:"rating", medium:"both", lo:null, module:"underwriting",
 rule:"Advisors must inform customers about the outright / high chances of rejection.",
 notes:[],
 annexure:[
  {letter:"A", text:"Not informing the customer about the chances of permanent exclusion for a customer's pre-existing disease (PED) in policies where applicable."},
  {letter:"B", text:"Not giving a heads up when the date of renewal is 7 days or less, and porting was recommended."},
  {letter:"C", text:"Not informing the customer that issuance of the policy depends on underwriting in case of PED.", notes:["If the customer's disease is not covered in the Disease-wise Tool and leads to even the slightest confusion, the advisor is expected to check with the medical team and give the appropriate heads up."]},
  {letter:"D", text:"Not informing customers who have recently been hospitalised, whether for surgical or non-surgical reasons, not to apply for a policy until one month after their discharge date, or according to the duration specified in the Disease-wise Tool (DWT) for their condition.", notes:["If the customer still wishes to receive a recommendation or claims to have fully recovered, the advisor may proceed with providing the recommendations."]},
  {letter:"E", text:"Not sending H/Unassisted payments in case the customer wants to complete the payment by himself."},
  {letter:"F", text:"If the customer is adamant to not disclose his PED even after giving the non-disclosure disclaimer (claim rejection and also possible policy termination), we have to inform the lead that we will help with the application, but if any claim issue related to the non-disclosed PED arises, or if the claim gets denied due to the non-disclosure, we will not be able to help with that particular claim on account of non-disclosure."}
 ]},

{code:"1.4", title:"Waiting Periods", rating:1, type:"rating", medium:"both", lo:null, module:"waiting-exclusions",

  {letter:"D", text:"Not discussing maternity waiting periods when discussing maternity plans.", notes:["This information can be shared in either snip/QR/own message/flow format."]},
  {letter:"E", text:"Mentioning the incorrect duration of any waiting period of the recommended plan."},
  {letter:"F", text:"Not recommending riders that reduce the waiting period when there is a PED in all the recommended plans that we sell.", notes:["Pitching the PED modification rider to 1 year when the PED falls under the specific illness list would be rated 1.","PED-rider-related details should be given as per the playbook."]},
  {letter:"G", text:"Suggesting riders to reduce waiting periods, even though the Disease-Wise Tool (DWT) mentions no waiting period for a certain condition, will be rated 1."}

 ]},

{code:"1.7", title:"Porting", rating:1, type:"rating", medium:"both", lo:null, module:"porting",
 rule:"Wrong/incomplete information about porting.",
 notes:[],
 annexure:[
  {letter:"A", text:"Not following the porting flow when the customer with an existing plan is looking to buy a new plan.", notes:["If the customer, in the middle of a conversation, discloses that they have an existing plan, the advisor should switch to the porting pitch."]},
  {letter:"B", text:"Advisors should use the Porting Flow Webapp to check the recommendations if the customer is looking to port/migrate, or if we are suggesting porting/migration. If the recommendation/narrative is not as per the Porting Flow Webapp, then it would be rated 1.", notes:["If the customer is adamant that he is not happy with the current insurer/current plan where we can't help them with porting/migration, the advisor can proceed as per the customer's interest and assist them with porting/migrating recommendations as applicable, and redirect them to the insurer after doing medical profiling. Else it would be rated 1.","Not following FAQ-1 mentioned in the Porting Flow Webapp when the lead asked about it would be rated 3."]},
  {letter:"C", text:"Recommending plans for porting in any case without understanding the insured's medical profile."},
  {letter:"D", text:"Not discussing the implications of porting on waiting periods and bonus when plans for porting were recommended."},
  {letter:"E", text:"Not informing about the porting window when the porting window is open."},
  {letter:"F", text:"Not considering the customer's declaration of medical conditions in chat, questionnaires, calls, and details mentioned in the previous policy document before providing a recommendation in case of porting."},
  {letter:"G", text:"Failure to inform customers about the fresh waiting periods applicable when increasing cover amounts during porting."},
  {letter:"H", text:"In case of porting, not mentioning that a new PED waiting period would apply for a condition diagnosed during the current policy period, if not disclosed to the current insurer."},
  {letter:"I", text:"Not adhering to the porting guidelines, if there are any, in the plans recommended.", notes:["Example: porting guidelines in Secure, along with the fresh waiting period on the Secure benefit and unlimited restoration add-on."]},
  {letter:"J", text:"Change of proposer decision lies with the insurer. Not informing the same would be rated 3 when the customer asked for it."}
 ]},

{code:"1.9", title:"Policy Features", rating:1, type:"rating", medium:"both", lo:null, module:"features",
 rule:"Missed a query / mistakes, or omissions of details mentioned in the playbook while explaining co-payment, room category details, disease-wise sub-limits, OPD, health check-ups, and maternity details to customers, and available cover amounts when the customer asked for the same.",
 notes:[
  "Missed a query / mistakes, or omissions of details mentioned in the annexure while explaining co-payment, room category details, disease-wise sub-limits in comprehensive plans would be rated 3 when the customer asked for it.",
  "Details mentioned under other points in the playbook: NRI discount if missed would be rated 3; any other feature-related points will be marked as per the SOP; health returns and other discounts will be rated 3.",
  "Misinformation about the available cover amounts in porting cases would be Rated 1, and in normal cases would be Rated 3.",
  "All the details mentioned in this section should be discussed as per the profile."
 ],
 annexure:[
  {letter:"A", text:"Failure to address a query on copayment, disease-wise sublimits, room rent restrictions, or failure to explain the definition and limits (if any) as per the playbook, in the recommended plans, when the customer inquires about copayment, disease-wise sublimits, and room rent restrictions.", notes:["If the limits are shared through the comparison snippet, then this will not be marked."]},
  {letter:"B", text:"Failure to address a query on the annual health check-up, or failure to explain the following when the customer is interested, when advisors pitch this add-on, or when the add-on is mandatory: if the annual health check-up is available as an add-on or a built-in feature; limits of this benefit for the cover amounts recommended/asked for; whether it is available on a reimbursement/cashless basis; and from when the customer can use this benefit.", notes:["If any of the details above are shared through the comparison snippet, then this will not be marked."]},
  {letter:"C", text:"Failure to address a query on the OPD benefit, or failure to explain the following when the customer is interested, when advisors pitch this add-on, or when the add-on is mandatory: if OPD is available as an add-on or a built-in feature; limits of this benefit for the cover amounts recommended/asked for; if OPD is available on a reimbursement/cashless basis; from when the customer can use this benefit; and coverage.", notes:["If any of the details above are shared through the comparison snippet, then this will not be marked.","If the customer wants OPD coverage, advisors can pitch the Care OPD add-ons without the OPD disclaimer, and Optima Well-being with the narrative as per the playbook, when the recommended plans are from HDFC and Care that offer OPD benefits, since these add-ons offer good value. Else it would be rated 3.","If the customer isn't satisfied with Optima Well-being and Care plans' OPD add-ons and asks for OPD options in other plans, then the advisor should give the general OPD disclaimer. Else it would be rated 3.","For all cases where the recommended plans are not OS variants or Care plans, the advisor must give the general OPD disclaimer — otherwise this will be rated 3.","Pitching the Optima Well Being rider without the customer asking for the same would be rated 3."]},
  {letter:"D", text:"Failure to address a query on the maternity benefit, or failure to explain the following when the customer inquires, when advisors pitch this add-on, or when the add-on is mandatory: if maternity is available as an add-on or a built-in feature; limits of this benefit for the cover amounts recommended/asked for; waiting periods to use this benefit; and coverage as per the customer's query.", notes:["If any of the details above are shared through the comparison snippet, then this will not be marked.","Failing to provide the maternity disclaimer when customers inquire about this benefit will be rated 3."]}
 ]},

{code:"3.2", title:"Policy Features", rating:3, type:"rating", medium:"both", lo:null, module:"features",
 rule:"Missed a query / mistakes / omissions of details mentioned in the annexure while explaining Cumulative Bonus, NCB, Restoration, Aggregate deductibles and Cashless anywhere when the customer asked for these; and missed a query / mistakes / omissions of details mentioned in the playbook while explaining CSR, ICR, age brackets, modern treatments, consumables, organ donor, add-ons, ambulance, in-built special features, or any other product feature other than the ones mentioned in Rating 1 and 2, when the customer asked for these.",
 notes:["If any details mentioned in the annexure are shared through the comparison snippet, they will not be marked."],
 annexure:[
  {letter:"A", text:"Failure to address a query on the Cumulative Bonus/NCB, or failure to explain the following when the customer inquires: definition; claw-back feature, if applicable in the policy recommended; that the bonus is irrespective of the claim made, if applicable; the percentage of increase every year and the limit of extension; any other limits, if applicable; and add-ons related to the bonus/NCB that Ditto generally recommends (Ex: Cumulative Bonus Super, etc.).", notes:["If any of the details above are shared through the comparison snippet, then this will not be marked."]},
  {letter:"B", text:"Failure to address a query on Restoration, or failure to explain the following when the customer inquires: definition; the percentage of restoration in the plans recommended; restoration on partial/complete exhaustion, whatever is applicable; frequency of restoration (one-time/unlimited) as applicable; clarity on the application of restoration on any illness/different illness as per the plans recommended; and any limits, if applicable (Ex: the single claim cannot exceed the base cover).", notes:["If any of the details above are shared through the comparison snippet, then this will not be marked.","Any wrong information or omission of information mentioned above in comprehensive plans like HDFC Optima Secure, Care Supreme, etc. would be Rated 3, and in restrictive plans like Care Heart, Care Freedom, etc. would be Rated 2."]},
  {letter:"C", text:"Failure to address a query on the Aggregate deductible, or failure to explain the following when the customer is interested in the aggregate deductible in the base plan: a disclaimer should be given when the customer is interested; the available aggregate deductible cover amounts as per the cover the customer preferred or the advisor pitched, if the customer wants to proceed even after the disclaimer; and the waiver of aggregate deductible clauses, if applicable, in the plans recommended."},
  {letter:"D", text:"Failure to address a query on Cashless anywhere, or failure to explain the same when the customer inquires about it.", notes:["If there are any concerns about the network hospitals list being shared, network hospital links will be shared, and if there are any negative responses from customers after sharing the network hospital links, advisors should explain the cashless-anywhere options available. Else, it would be rated 3."]}
 ]},

{code:"3.6", title:"Miscellaneous", rating:3, type:"rating", medium:"both", lo:null, module:"misc36",
 rule:"General mistakes/omissions usually observed.",
 notes:["This is not an exhaustive list; there are a few other areas as well where, if mistakes/omissions are observed, the chat/call rating can be lowered accordingly."],
 annexure:[
  {letter:"A", text:"If there is any recommendation in the disease-wise tool that we do not sell, advisors should share the recommendation and explain why we do not sell that particular plan.", notes:["Example: Manipal Cigna plans for certain epilepsy cases."]},
  {letter:"B", text:"Not informing the customer that a rider is mandatory after sharing the premiums, which included mandatory riders too."},
  {letter:"C", text:"Not mentioning the word \"high\" but just saying chances of rejection, when a condition in the disease-wise tool says outright rejection or high chances of rejection.", notes:["Example: in Diabetes Type 1 and taking insulin shots, DWT says Energy with HIGH chances of rejection. Advisors need to similarly check for PEDs in the DWT for this note."]},
  {letter:"D", text:"Not informing the customer that the premiums would change with age / age bands whenever the premiums are shared. The advisor who shared the premiums is responsible for the same.", notes:["If the customer asks for an estimated percentage increase in premium, we can share the following numbers — Secure: 2 to 4% till age 60, 8 to 10% above 60. Other plans: age bands — 15 to 30% when moving from one age band to another."]},
  {letter:"E", text:"Not informing that policy issuance depends on underwriting if the customer mentions smoking 10 or more cigarettes per day, or describes themselves as a chain smoker. Similarly, if their BMI is abnormal, they should also be warned about underwriting.", notes:["We do not directly ask about smoking status or BMI. If a customer voluntarily shares this information or indicates abnormal weight, advisors should check the BMI and provide a heads-up accordingly."]},
  {letter:"F", text:"Not giving the NRI disclaimer when the customer (proposer/insured) is an international client.", notes:["If the customer is adamant to go ahead with the purchase post giving the disclaimer, advisors can recommend HDFC and Care plans.","If the customer, being an NRI (proposer), is looking for the person who lives in India, advisors should nudge to have either the insured become the proposer, or any sibling or any person from India who can become the proposer. Not nudging the same would be rated 4."]},
  {letter:"G", text:"Not informing the customer to attach the Renewal Notice of the current policy (if available) to get porting benefits on the bonus part for enhancing the sum insured in the new ported policy, along with the document list, when the customer is looking to enhance his cover amount.", notes:["When the lead is going with the same cover amount / lower cover amount as the existing plan, then a renewal notice is not required. Asking for a renewal notice and not proceeding with the payment in such cases would be rated 1, and not asking for a renewal notice in cases where the lead is going with a higher cover amount than the existing cover would be rated 1."]},
  {letter:"H", text:"In general, giving wrong information about the ideal BMI range for our recommended plans in discussion."},
  {letter:"I", text:"Not informing about the expected time of issuance in porting and non-porting cases, when the customer enquires about the same.", notes:["Advisors need not convey the exact date. FYI, the TAT for policy issuance is approximately 7–14 working days for non-porting cases, and approximately 3 weeks for porting cases.","Overpromising / giving a wrong timeline when the customer enquires about the timeline of issuance — according to the profile and along with the disclaimer if the advisor missed informing that if additional docs are asked or medical is triggered, then due to back and forth the timeline may get extended — for non-porting cases and for porting cases, this would be rated 4."]},
  {letter:"J", text:"Not leaving the chat IDs in the notes for the evaluation of both chat IDs, when the conversation with the same lead happened in two different chats."},
  {letter:"K", text:"For customers who have purchased a policy through us previously and want to explore porting/migration or ask about renewals, advisors should redirect them to the Renewal team.", notes:["Advisors can confirm with the customer if the plan was purchased through us, or check the payment history for the details of the purchase of the plan, or check the policy document copy."]},
  {letter:"L", text:"Not informing about the fresh waiting periods and loading charges applicable when increasing cover amounts, or during porting in future, if the customer enquires about the same."},
  {letter:"M", text:"Issuance Date is used to determine the timeline for the 30-day free-look period. Start Date is the basis for calculating the Coverage Start Date and Waiting Periods. Any mistakes made while explaining this, when the customer enquired about the same, would be rated 3.", notes:["The Start Date corresponds to the beginning date specified in the \"Period of Insurance\" section (which clearly outlines the start and end dates of the coverage). Example: if the Period of Insurance is stated as (12-05-2026 to 11-05-2027), then 12-05-2026 will be considered the start date."]},
  {letter:"N", text:"Missing to give the disclaimer/narrative as per the playbook when the customer enquires about the Care Ultimate plan would be rated 3."}
 ]},

{code:"3.7", title:"Information to be shared over chat if discussed over call (Calls specific)", rating:3, type:"rating", medium:"call", lo:null, module:"docs",
 rule:"Not sharing specific information over chat.",
 notes:[
  "If all mandatory information as per the SOP/playbook was not shared over the call but was shared over the chat, then that shall not be marked.",
  "If any information was shared over the call but corrected in the chat, then that shall not be marked.",
  "If the advisor gave the definition of a feature/rider over the call and said the limits/conditions related to the same over the chat, then that shall not be marked.",
  "If the information as per the SOP/Playbook is completely shared over the call, and the advisor promised to share it over the chat but ended up not sharing the same, then that shall be Rated 3.",
  "If an advisor had promised anything to the customer on chat or call, they need to send the same by the End Of the same Day promised, and the same EOD timeline is to be specified to the customer (not a vague timeline like \"in some time\", \"in a few hours\" etc.). Else, it would be Rated 3 even if the promised details were shared the next day.",
  "If the advisor provides correct information during a call but shares incorrect information through chat, the error will be marked according to the SOP/Playbook if it pertains to the product. If the query is general, it will be Rated 3."
 ],
 annexure:[
  {letter:"A", text:"Not sharing the premiums snips."},
  {letter:"B", text:"Not sharing information about the riders included in the premiums, if not discussed over the call."},
  {letter:"C", text:"Not sharing the policy wordings/brochure links of the discussed plans."},
  {letter:"D", text:"Not sharing the exclusions links, specific illness links, or specific illness snips of the plans we sell and recommend to the customer."}
 ]},

{code:"3.8", title:"Query", rating:3, type:"rating", medium:"both", lo:null, module:"conduct",
 rule:"Chat specific: mistake / missed a query, which is a general query. Call specific: mistake (general query) / missed a query (includes general query / product-related query).",
 notes:["Chat and Call specific: if the pending notes for another profile discussion were not added, leading to a missed discussion on the same, it will be classified as a missed query and rated 3. In this case, the advisor who promised the customer to discuss one profile after another will be marked."],
 annexure:[]},

{code:"4.1", title:"Miscellaneous", rating:4, type:"rating", medium:"both", lo:null, module:"misc41",
 rule:"Suggestions regarding scenarios that can potentially impact the customer experience, mitigate negative impacts, or enhance the customer experience.",
 notes:["The Quality Assurance team will be actively involved in evaluating various subjective scenarios to ensure a comprehensive understanding of their potential impact on customer experience.","This is not an exhaustive list; there are a few other areas as well where, if mistakes/omissions are observed in the chat/call, it would be Rated 4."],
 annexure:[
  {letter:"A", text:"Sharing screenshots of internal documents, such as the Health FAQs, Operational Metrics sheet, etc. Only screenshots of documents which are in the public domain (e.g. policy brochures, Ditto website, etc.) are to be shared with the customer."},
  {letter:"B", text:"Giving straightforward/robotic replies."},
  {letter:"C", text:"Not sharing the network hospital links / not giving the correct network hospital number."},
  {letter:"D", text:"Not sending H/Tax benefit in the multi-pay QR and discounts, if multi-pay premiums are shared. The advisor who shares multi-pay is responsible for sharing the H/Tax benefit in the multi-pay QR and discounts."},
  {letter:"E", text:"Not informing the customer that if any plans or add-ons are not possible through Ditto, or about add-on availability for the customer to purchase, or that porting is not possible through Ditto."},
  {letter:"F", text:"Not informing about the porting window when the porting window is not open."},
  {letter:"G", text:"Missing out on discussing a premium increase due to inflation (14–18%) when the customer asks for it."},
  {letter:"H", text:"Omission of conveying the chances of issuance depending on UW with respect to the PED riders."},
  {letter:"I", text:"Missing out on advising or nudging for a minimum cover of 10L for customers who are looking for a lower cover."},
  {letter:"J", text:"Answering the customer's query only partially correctly."},
  {letter:"K", text:"Failure to inform the customer to disclose changes in lifestyle habits or PEDs to the insurer post-issuance, when customers ask for it."},

function ratingBadgeClass(rule){
 if(rule.type==="suggestion") return "badge-sugg";
 if(rule.type==="persona") return "badge-persona";
 if(rule.rating) return "badge-"+rule.rating;
 return "badge-outline";
}
function ratingBadgeLabel(rule){
 if(rule.type==="suggestion") return "Suggestion";
 if(rule.type==="persona"){
  return rule.rating ? ("Persona · Rated "+rule.rating) : "Persona · Highlighted";
 }
 if(rule.rating===5) return "Rating 5 · No mistake";
 if(rule.rating) return "Rating "+rule.rating;
 return "Highlighted";
}
function ratingCssVar(rule){
 if(rule.type==="suggestion") return "var(--sugg)";
 if(rule.type==="persona") return "var(--persona)";
 if(rule.rating) return "var(--r"+rule.rating+")";
 return "var(--ink-faint)";
}
function mediumLabel(m){
 if(m==="chat") return "Chat specific";
 if(m==="call") return "Call specific";
 return "Chat & Call";
}
function esc(s){
 return String(s).replace(/[&<>]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
}
function findRule(code){ return RULES.find(r=>r.code===code); }

/* ---------------------------------------------------------------
   Rule card renderer (shared by Explorer + Learning Modules)
--------------------------------------------------------------- */
function renderRuleCard(rule, opts){
 opts = opts || {};
 const hasMore = (rule.notes && rule.notes.length) || (rule.annexure && rule.annexure.length);
 const uid = "rc_"+rule.code.replace(/[^a-zA-Z0-9]/g,"_")+"_"+Math.random().toString(36).slice(2,7);
 let tags = "";
 if(rule.medium && rule.medium!=="both"){
  tags += `<span class="badge badge-outline">${mediumLabel(rule.medium)}</span>`;
 }
 if(rule.lo){
  tags += `<span class="badge badge-outline">${rule.lo==="LO"?"LO advisors":"Non-LO"}</span>`;
 }
 let notesHtml = "";
 if(rule.notes && rule.notes.length){
  notesHtml = rule.notes.map(n=>`<div class="note-item">${esc(n)}</div>`).join("");
 }
 let annexHtml = "";
 if(rule.annexure && rule.annexure.length){
  annexHtml = `<div class="field-label" style="margin-top:${notesHtml?'12px':'0'}">Annexure detail</div>` +
   rule.annexure.map(a=>{
    let sub = "";
    if(a.notes && a.notes.length){
     sub = a.notes.map(n=>`<div class="note-item">${esc(n)}</div>`).join("");
    }
    return `<div class="annex-item"><span class="letter">${a.letter}</span>${esc(a.text)}${sub}</div>`;
   }).join("");
 }
 const moreBlock = hasMore ? `
  <div class="rule-more hidden" id="${uid}">
   ${notesHtml}
   ${annexHtml}
  </div>
  <button class="expand-btn" onclick="toggleMore('${uid}', this)">${opts.startOpen? 'Hide details' : 'Show notes & annexure detail ('+((rule.notes?rule.notes.length:0)+(rule.annexure?rule.annexure.length:0))+')'}</button>
 ` : "";

 return `
 <div class="card rule-card" style="--c:${ratingCssVar(rule)}">
  <div class="rule-head">
   <div>
    <div class="rule-code">${esc(rule.code)}</div>
    <div class="rule-title">${esc(rule.title)}</div>
   </div>
   <span class="badge ${ratingBadgeClass(rule)}">${ratingBadgeLabel(rule)}</span>
  </div>
  <div class="rule-rule">${esc(rule.rule)}</div>
  ${tags ? `<div class="rule-tags">${tags}</div>` : ""}
  ${moreBlock}
 </div>`;
}
function toggleMore(uid, btn){
 const el = document.getElementById(uid);
 el.classList.toggle("hidden");
 const isOpen = !el.classList.contains("hidden");
 btn.textContent = isOpen ? "Hide details" : btn.textContent.replace("Hide details","Show notes & annexure detail");
 if(isOpen){
  const count = el.querySelectorAll(".note-item, .annex-item").length;
 }
}

let explorerState = {q:"", rating:"all", type:"all"};
function renderExplorer(){
 return `
 <div class="eyebrow">Section 2</div>
 <h2>SOP Explorer</h2>
 <p class="intro">Search or filter every SOP code and its annexure detail. Results always show the exact code, rating, and rule as written.</p>
 <div class="toolbar">
  <div class="search-box">
   <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
   <input type="text" id="explorerSearch" placeholder="Search by keyword, SOP code, or topic (e.g. 'porting', '1.9', 'maternity')" oninput="onExplorerSearch(this.value)">
  </div>
 </div>
 <div class="chip-row" style="margin-bottom:8px;">
  <span class="chip" data-f="rating" data-v="all">All ratings</span>
  <span class="chip" data-f="rating" data-v="1">Rating 1</span>
  <span class="chip" data-f="rating" data-v="2">Rating 2</span>
  <span class="chip" data-f="rating" data-v="3">Rating 3</span>
  <span class="chip" data-f="rating" data-v="4">Rating 4</span>
  <span class="chip" data-f="rating" data-v="5">Rating 5</span>
  <span class="chip" data-f="type" data-v="suggestion">Suggestions</span>
  <span class="chip" data-f="type" data-v="persona">Persona</span>
 </div>
 <div class="result-count" id="explorerCount"></div>
 <div id="explorerResults"></div>
 `;
}
function wireExplorer(){
 document.querySelectorAll('.chip[data-f]').forEach(chip=>{
  chip.onclick = ()=>{
   const f = chip.dataset.f, v = chip.dataset.v;
   if(f==="rating"){
    explorerState.rating = v;
    if(v!=="all") explorerState.type="all";
   } else if(f==="type"){
    explorerState.type = (explorerState.type===v) ? "all" : v;
    explorerState.rating="all";
   }
   syncExplorerChips();
   drawExplorerResults();
  };
 });
 syncExplorerChips();
 const input = document.getElementById('explorerSearch');
 if(input) input.value = explorerState.q;
 drawExplorerResults();
}
function syncExplorerChips(){
 document.querySelectorAll('.chip[data-f]').forEach(chip=>{
  const f=chip.dataset.f, v=chip.dataset.v;
  let active=false;
  if(f==="rating") active = (explorerState.rating===v);
  if(f==="type") active = (explorerState.type===v);
  chip.classList.toggle("active", active);
 });
}
function onExplorerSearch(v){
 explorerState.q = v.toLowerCase();
 drawExplorerResults();
}
function matchRule(rule, state){
 if(state.rating!=="all"){
  if(String(rule.rating)!==String(state.rating)) return false;
 }
 if(state.type!=="all"){
  if(rule.type!==state.type) return false;
 }
 if(state.q){
  const hay = [rule.code, rule.title, rule.rule, (rule.notes||[]).join(" "), (rule.annexure||[]).map(a=>a.text+" "+(a.notes||[]).join(" ")).join(" ")].join(" ").toLowerCase();
  if(!hay.includes(state.q)) return false;
 }
 return true;
}
function drawExplorerResults(){
 const results = RULES.filter(r=>matchRule(r, explorerState));
 document.getElementById('explorerCount').textContent = results.length + " result" + (results.length===1?"":"s");
 document.getElementById('explorerResults').innerHTML = results.length
  ? results.map(r=>renderRuleCard(r)).join("")
  : `<div class="card" style="padding:24px; text-align:center; color:var(--ink-faint); font-size:13.5px;">No SOP codes match that search.</div>`;
}
function goExplorerFiltered(kind, val){
 explorerState = {q:"", rating: kind==="rating"?String(val):"all", type: kind==="type"?val:"all"};
 navigate('explorer');
}

function renderModuleTopic(rule){
 const examples = (rule.annexure||[]).filter(a => /\bEx(ample)?[:.]/.test((a.text||"")+" "+(a.notes||[]).join(" ")));
 return `
 <div class="topic-block">
  <h4>${esc(rule.title)} <span class="badge ${ratingBadgeClass(rule)}">${ratingBadgeLabel(rule)}</span> <span class="badge badge-outline">${esc(rule.code)}</span></h4>
  <div class="field-label">What the SOP requires</div>
  <div class="sop-requires">${esc(rule.rule)}</div>
  ${rule.notes && rule.notes.length ? `<div class="field-label">Important notes / exceptions</div>` + rule.notes.map(n=>`<div class="note-item">${esc(n)}</div>`).join("") : ""}
  ${rule.annexure && rule.annexure.length ? `<div class="field-label">Annexure detail</div>` + rule.annexure.map(a=>`<div class="annex-item"><span class="letter">${a.letter}</span>${esc(a.text)}${(a.notes||[]).map(n=>`<div class="note-item">${esc(n)}</div>`).join("")}</div>`).join("") : ""}
 </div>`;
}
function toggleModule(i){
 const body = document.getElementById('mb_'+i);
 const head = document.getElementById('mh_'+i);
 const isOpen = head.classList.contains('open');
 body.classList.toggle('open', !isOpen);
 head.classList.toggle('open', !isOpen);
 markVisited('modules');
}

/* ---------------------------------------------------------------
   4. RATING BOUNDARIES VIEW
--------------------------------------------------------------- */
function renderBoundaries(){

  <div class="card boundary-card">
   <div class="boundary-title">${esc(b.title)}</div>
   <div class="vs-row">
    <div class="vs-col">
     <span class="badge ${typeof b.left.rating==='number' ? 'badge-'+b.left.rating : 'badge-outline'}">${typeof b.left.rating==='number' ? 'Rating '+b.left.rating : esc(String(b.left.rating))}</span>
     <p>${esc(b.left.text)}</p>
    </div>
    <div class="vs-mid">vs</div>
    <div class="vs-col">
     <span class="badge ${typeof b.right.rating==='number' ? 'badge-'+b.right.rating : 'badge-outline'}">${typeof b.right.rating==='number' ? 'Rating '+b.right.rating : esc(String(b.right.rating))}</span>
     <p>${esc(b.right.text)}</p>
    </div>
   </div>
   <div class="note-item" style="margin-top:12px;"><b>Why:</b> ${esc(b.why)}</div>
   <div class="boundary-source">Source: ${esc(b.source)}</div>
  </div>
 `).join("");
 return `
 <div class="eyebrow">Section 4</div>
 <h2>Rating Boundaries</h2>
 <p class="intro">Similar-looking mistakes that the SOP itself rates differently. Each distinction below is drawn directly from the SOP's own wording — nothing here is inferred.</p>
 ${cards}
 `;
}

/* ---------------------------------------------------------------
   5. COMMON MISTAKES (from internal feedback log) VIEW
--------------------------------------------------------------- */
function renderMistakes(){
 const cards = MISTAKES.map(m=>`
  <div class="card mistake-card">
   <div class="mistake-head">
    <div class="mistake-title">${esc(m.title)}</div>
    <span class="mistake-count">${esc(m.count)}</span>
   </div>
   <div class="mistake-codes">${m.codes.map(c=>`<button class="code-pill" onclick="goExplorerSearch('${c.replace(/'/g,"\\'")}')">${esc(c)}</button>`).join("")}</div>

    <div>
     <div class="mistake-col-head wrong">What went wrong</div>
     <ul class="mistake-list">${m.wrong.map(w=>`<li>${esc(w)}</li>`).join("")}</ul>
    </div>
    <div>
     <div class="mistake-col-head ideal">Ideal approach (per SOP)</div>
     <ul class="mistake-list">${m.ideal.map(w=>`<li>${esc(w)}</li>`).join("")}</ul>
    </div>
   </div>
  </div>
 `).join("");
 return `
 <div class="eyebrow">Section 5</div>
 <h2>Common Mistakes — From Real Feedback</h2>
 <p class="intro">Patterns pulled from Common Mistakes advisors received on live chats and calls.</p>
 <div class="stat-strip">
  <div class="stat-box"><div class="stat-num">${FEEDBACK_STATS.total}</div><div class="stat-lbl">Chats/calls reviewed</div></div>
  <div class="stat-box"><div class="stat-num">${FEEDBACK_STATS.flagged}</div><div class="stat-lbl">Carried a Red or Orange flag (${FEEDBACK_STATS.pct}%)</div></div>
  <div class="stat-box"><div class="stat-num">${FEEDBACK_STATS.issues}</div><div class="stat-lbl">Individual issues logged</div></div>
  <div class="stat-box"><div class="stat-num">${MISTAKES.length}</div><div class="stat-lbl">Recurring patterns below</div></div>
 </div>
 ${cards}
 <p class="footer-note">Source: DH87 — Common Mistakes feedback log .</p>
 `;
}
function goExplorerSearch(code){
 explorerState = {q: code.toLowerCase(), rating:"all", type:"all"};
 navigate('explorer');
}

/* ---------------------------------------------------------------
   6. SCENARIO-BASED LEARNING VIEW
--------------------------------------------------------------- */
function renderScenarios(){
 const cards = SCENARIOS.map((s,i)=>`
  <div class="card scenario-card">
   <div class="scenario-num">Scenario ${i+1}</div>
   <div class="scenario-text">${esc(s.q)}</div>
   <div class="scenario-q">${esc(s.ask)}</div>
   <button class="reveal-btn" onclick="revealScenario(${i})">Show answer &amp; SOP code</button>
   <div class="scenario-reveal" id="sr_${i}">
    <div>${esc(s.answer)}</div>
    <div style="margin-top:10px;"><span class="badge ${s.rating ? 'badge-'+s.rating : 'badge-outline'}">${s.rating ? 'Rated '+s.rating : 'See SOP'}</span> <span class="badge badge-outline">${esc(s.code)}</span></div>
   </div>
  </div>
 `).join("");
 return `
 <div class="eyebrow">Section 6</div>
 <h2>Scenario-Based Learning</h2>
 <p class="intro">Every scenario below is drawn from a situation explicitly described in the SOP or its Annexure. Think through your answer.</p>
 ${cards}
 `;
}
function revealScenario(i){
 const el = document.getElementById('sr_'+i);
 el.classList.toggle('shown');
 markVisited('scenarios');
}

/* ---------------------------------------------------------------
   7. FINAL QUIZ VIEW  (supports going back + reviewing answers)
--------------------------------------------------------------- */
let quizState = {i:0, answers:new Array(QUIZ.length).fill(null), done:false, reviewMode:false};
function quizScore(){
 return quizState.answers.reduce((s,a,idx)=> s + (a!==null && a===QUIZ[idx].correct ? 1 : 0), 0);
}
function quizFrontier(){
 const firstUnanswered = quizState.answers.findIndex(a=>a===null);
 return firstUnanswered === -1 ? QUIZ.length-1 : firstUnanswered;
}
function renderQuiz(){
 if(quizState.done && !quizState.reviewMode){
  return renderQuizResult();
 }
 const total = QUIZ.length;
 const q = QUIZ[quizState.i];
 const already = quizState.answers[quizState.i] !== null;
 const frontier = quizFrontier();

 const optsHtml = q.options.map((opt,idx)=>{
  let cls = "quiz-opt";
  if(already){
   cls += " disabled";
   if(idx===q.correct) cls += " correct";
   else if(idx===quizState.answers[quizState.i]) cls += " incorrect";
  }
  return `<button class="${cls}" ${already?'':`onclick="answerQuiz(${idx})"`}>${esc(opt)}</button>`;
 }).join("");

 const dots = QUIZ.map((qq,idx)=>{
  const ans = quizState.answers[idx];
  const locked = !quizState.reviewMode && idx > frontier;
  let cls = "quiz-dot";
  if(idx===quizState.i) cls += " current";
  if(ans!==null) cls += (ans===qq.correct ? " correct" : " incorrect");
  if(locked) cls += " locked";
  return `<button class="${cls}" ${locked? 'disabled':`onclick="goToQuiz(${idx})"`}>${idx+1}</button>`;
 }).join("");

 let nextLabel, nextEnabled, nextFn;
 if(quizState.reviewMode){
  nextLabel = (quizState.i+1 < total) ? "Next question" : "Back to results";
  nextEnabled = true;
  nextFn = "nextQuiz()";
 } else {
  nextLabel = (quizState.i+1 < total) ? "Next question" : "See results";
  nextEnabled = already;
  nextFn = "nextQuiz()";
 }

 return `
 <div class="eyebrow">Section 7</div>
 <h2>Final Quiz</h2>
 <p class="intro">${total} questions covering major SOP areas and common mistakes.</p>
 ${quizState.reviewMode ? `<div class="review-banner"><span>Reviewing your answers</span><button class="btn secondary" style="padding:5px 12px; font-size:11.5px;" onclick="backToResults()">Exit review</button></div>` : ""}
 <div class="quiz-shell">
  <div class="quiz-progress"><span>Question ${quizState.i+1} of ${total}</span><span>Score so far: ${quizScore()}</span></div>
  <div class="quiz-dots">${dots}</div>
  <div class="card quiz-card">
   <div class="quiz-q">${esc(q.q)}</div>
   <div id="quizOpts">${optsHtml}</div>
   <div class="quiz-explain ${already?'shown':''}" id="quizExplain">${esc(q.explain)}</div>
   <div class="quiz-nav">
    <button class="btn secondary" onclick="prevQuiz()" ${quizState.i===0?'disabled':''}>Previous</button>
    <button class="btn" id="quizNextBtn" onclick="${nextFn}" ${nextEnabled?'':'disabled'}>${nextLabel}</button>
   </div>
  </div>
 </div>
 `;
}
function answerQuiz(idx){
 if(quizState.answers[quizState.i] !== null) return;
 quizState.answers[quizState.i] = idx;
 renderView('quiz');
}
function goToQuiz(idx){
 const frontier = quizFrontier();
 if(!quizState.reviewMode && idx > frontier) return;
 quizState.i = idx;
 renderView('quiz');
}
function prevQuiz(){
 if(quizState.i > 0){
  quizState.i--;
  renderView('quiz');
 }
}
function nextQuiz(){
 if(quizState.reviewMode){
  if(quizState.i+1 < QUIZ.length){
   quizState.i++;
  } else {
   quizState.reviewMode = false;
  }
  renderView('quiz');
  return;
 }
 if(quizState.answers[quizState.i] === null) return;
 if(quizState.i+1 >= QUIZ.length){
  quizState.done = true;
 } else {
  quizState.i++;
 }
 renderView('quiz');
}
function startReview(){
 quizState.reviewMode = true;
 quizState.i = 0;
 renderView('quiz');
}
function backToResults(){
 quizState.reviewMode = false;
 renderView('quiz');
}
function renderQuizResult(){
 const total = QUIZ.length;
 const score = quizScore();
 const pct = Math.round((score/total)*100);
 let msg = "Take another pass through the SOP Explorer for the codes you missed.";
 if(pct>=90) msg = "Strong grasp of the SOP — ready to apply this to live chats/calls.";
 else if(pct>=70) msg = "Good foundation — revisit the Rating Boundaries section for the finer distinctions.";
 return `
 <div class="eyebrow">Section 7</div>
 <h2>Final Quiz</h2>
 <div class="quiz-shell">
  <div class="card quiz-result">
   <div class="score-lbl">Your score</div>
   <div class="score">${score} / ${total}</div>
   <p style="color:var(--ink-soft); font-size:13.5px; max-width:420px; margin:0 auto 20px;">${pct}% correct. ${msg}</p>
   <div class="result-actions">
    <button class="btn secondary" onclick="startReview()">Review answers</button>
    <button class="btn" onclick="restartQuiz()">Retake quiz</button>
   </div>
  </div>
 </div>
 `;
}
function restartQuiz(){
 quizState = {i:0, answers:new Array(QUIZ.length).fill(null), done:false, reviewMode:false};
 renderView('quiz');
}

/* ---------------------------------------------------------------
   8. QUICK REFERENCE VIEW
--------------------------------------------------------------- */
function renderReference(){
 const rows = RULES.map(r=>`
  <tr>
   <td class="code-cell">${esc(r.code)}</td>
   <td><span class="badge ${ratingBadgeClass(r)}">${ratingBadgeLabel(r)}</span></td>
   <td>${esc(r.title)}</td>
   <td>${esc(r.rule)}</td>
  </tr>
 `).join("");
 return `
 <div class="eyebrow">Section 8</div>
 <h2>Quick Reference</h2>
 <p class="intro">A sneak peak into the main categories.</p>
 <div class="toolbar">
  <div class="search-box">
   <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
   <input type="text" id="refSearch" placeholder="Filter the table..." oninput="filterReference(this.value)">
  </div>
 </div>
 <div class="ref-scroll">
  <table class="ref-table" id="refTable">
   <thead><tr><th>Code</th><th>Rating</th><th>Category</th><th>Rule</th></tr></thead>
   <tbody id="refBody">${rows}</tbody>
  </table>
 </div>
 `;
}
function filterReference(v){
 v = v.toLowerCase();
 document.querySelectorAll('#refBody tr').forEach(tr=>{
  tr.style.display = tr.textContent.toLowerCase().includes(v) ? "" : "none";
 });
}

/* ---------------------------------------------------------------
   NAV / APP SHELL
--------------------------------------------------------------- */
const PAGES = [
 {id:"framework", label:"Rating Framework", render:renderFramework},
 {id:"explorer", label:"SOP Explorer", render:renderExplorer, after:wireExplorer},
 {id:"modules", label:"Learning Modules", render:renderModules},
 {id:"boundaries", label:"Rating Boundaries", render:renderBoundaries},
 {id:"mistakes", label:"Common Mistakes", render:renderMistakes},
 {id:"scenarios", label:"Scenario-Based Learning", render:renderScenarios},
 {id:"quiz", label:"Final Quiz", render:renderQuiz},
 {id:"reference", label:"Quick Reference", render:renderReference}
];
let visited = new Set();
let currentPage = "framework";

function buildNav(){
 const nav = document.getElementById('navList');
 nav.innerHTML = PAGES.map((p,i)=>`
  <button class="navlink" id="nav_${p.id}" onclick="navigate('${p.id}')">
   <span class="num">${i+1}</span>${esc(p.label)}
  </button>
 `).join("");
}
function navigate(id){
 currentPage = id;
 renderView(id);
 markVisited(id);
 document.querySelectorAll('.navlink').forEach(b=>b.classList.remove('active'));
 const btn = document.getElementById('nav_'+id);
 if(btn) btn.classList.add('active');
 if(window.scrollTo) window.scrollTo(0,0);
 const sidebar = document.getElementById('sidebar');
 if(window.innerWidth <= 900) sidebar.classList.remove('open');
}
function renderView(id){
 const page = PAGES.find(p=>p.id===id);
 if(!page) return;
 document.getElementById('viewRoot').innerHTML = `<div class="view active">${page.render()}</div>`;
 if(page.after) page.after();
}
function markVisited(id){
 visited.add(id);
 const pct = Math.round((visited.size / PAGES.length) * 100);
 document.getElementById('progressPct').textContent = pct + "%";
 document.getElementById('progressFill').style.width = pct + "%";
}

document.getElementById('menuToggle').addEventListener('click', ()=>{
 document.getElementById('sidebar').classList.toggle('open');
});

buildNav();
navigate('framework');

</script>
